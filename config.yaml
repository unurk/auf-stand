# Auf Stand — Konfiguration

# Öffentliche RSS-Feeds der Presse (Headlines + Teaser).
# Beim ersten Lauf mit `python -m auf_stand.main feeds` verifizieren —
# URL-Schema kann sich ändern. Weitere Ressorts: EU, Recht, Tech, Science, Meinung …
feeds:
  - name: Startseite
    url: https://www.diepresse.com/rss
  - name: Politik
    url: https://www.diepresse.com/rss/Politik
  - name: Wirtschaft
    url: https://www.diepresse.com/rss/Wirtschaft
  - name: Unternehmen
    url: https://www.diepresse.com/rss/Unternehmen

max_articles_per_feed: 15

# Themen-Tracker: explizit verfolgte Entwicklungen (KEINE Klick-Personalisierung).
# Erscheinen im Lagebild nur, wenn es eine materielle Änderung gibt.
# schlagwort: kurzes Stichwort, um die Themen-Delta-Zeile dem Tracker zuzuordnen
# (für den Verlauf/das Dossier in data/state.json). Reiner String geht auch.
topics:
  - name: US-Zölle und Folgen für die österreichische Exportwirtschaft
    schlagwort: Zoll
    assessment_question: "Bist du beruflich oder privat von Exporten, Zöllen oder internationaler Wirtschaftspolitik betroffen?"
  - name: Mietrecht und Wohnkosten in Österreich
    schlagwort: Miet
    assessment_question: "Wohnst du zur Miete oder planst du in den nächsten Jahren eine Immobilie zu kaufen oder mieten?"
  - name: "US-Börsen: S&P 500, Nasdaq, Dow Jones — Kursrichtung und Treiber"
    schlagwort: Börse
    assessment_question: "Hast du Aktien, ETFs oder ein Wertpapierdepot — oder interessierst du dich für Börsenentwicklungen?"
  - name: EZB-Zinsentscheidungen und Folgen für Österreich
    schlagwort: EZB
    assessment_question: "Betrifft dich der Leitzins direkt — z.B. über einen Kredit, ein Sparbuch oder Wohnbaufinanzierung?"
  - name: Energiepreise und Stromkosten in Österreich
    schlagwort: Energie
    assessment_question: "Spielen Strom- und Energiekosten eine spürbare Rolle in deinem Haushalt oder Unternehmen?"
  - name: Inflation und Kaufkraft in Österreich
    schlagwort: Inflation
    assessment_question: "Merkst du, dass dein Geld weniger weit reicht — beim Einkauf, Restaurant oder Urlaub?"
  - name: Österreichische Innenpolitik
    schlagwort: Koalition
    assessment_question: "Interessierst du dich für die Arbeit der Bundesregierung und aktuelle Politikentscheidungen?"
  - name: EU-Politik und Österreich
    schlagwort: EU
    assessment_question: "Berühren EU-Entscheidungen (Regulierungen, Förderprogramme, Binnenmarkt) deinen Alltag oder Beruf?"
  - name: Arbeitsmarkt und Beschäftigung
    schlagwort: Arbeitsmarkt
    assessment_question: "Interessiert dich, wie sich der Arbeitsmarkt entwickelt — z.B. wegen Job, Mitarbeitersuche oder Pensionierung?"
  - name: Klimapolitik und Umwelt Österreich
    schlagwort: Klima
    assessment_question: "Ist dir Klimapolitik und Umweltschutz wichtig — privat oder beruflich?"
  - name: Künstliche Intelligenz und Digitalisierung
    schlagwort: KI
    assessment_question: "Betrifft dich KI — als Anwender, im Job, oder weil du die Entwicklung verfolgst?"
  - name: Ukraine-Krieg und Sicherheitspolitik
    schlagwort: Ukraine
    assessment_question: "Verfolgst du den Ukraine-Krieg und seine Folgen für Europa und Österreich?"
  - name: Österreichische Unternehmen und Wirtschaft
    schlagwort: Wirtschaft
    assessment_question: "Interessierst du dich für die Lage österreichischer Betriebe — als Unternehmer, Mitarbeiter oder Investor?"
  - name: Migration und Integration in Österreich
    schlagwort: Migration
    assessment_question: "Ist das Thema Migration und Integration für dich beruflich oder gesellschaftlich relevant?"
  - name: Gesundheitssystem und Medizin Österreich
    schlagwort: Gesundheit
    assessment_question: "Betrifft dich das Gesundheitssystem — als Patient, Angehöriger oder im Gesundheitsbereich tätig?"

# Claude-Modell für die Synthese
model: claude-haiku-4-5
max_tokens: 2500

# Audio-Ausgabe: das Lagebild zum Hören (OpenAI TTS). Braucht OPENAI_API_KEY in .env.
# enabled: false schaltet Audio hart ab, auch wenn ein Key gesetzt ist.
tts:
  enabled: true
  model: gpt-4o-mini-tts
  voice: alloy
  instructions: "Sprich ruhig und sachlich, im Tempo einer seriösen Nachrichtensprecherin."

# Volltexte nur für diese Ressorts holen (spart API-Kosten).
# Andere Ressorts gehen weiter als Teaser in die Synthese ein.
fulltext_ressorts:
  - Politik
  - Wirtschaft
  - Unternehmen

# Ausgaben
editions:
  morgen:
    label: "Morgen-Ausgabe"
    lookback_hours: 18      # Artikel der letzten Nacht + Vorabend
  abend:
    label: "Abend-Ausgabe"
    lookback_hours: 11      # nur was seit der Morgen-Ausgabe neu ist (Delta via state)

# Vorausschau: Termine der nächsten 7 Tage, die im Morgen-Lagebild erscheinen.
# Format: datum (YYYY-MM-DD), name, tracker (optional — muss exakt einem Themen-Tracker entsprechen).
# EZB-Termine: https://www.ecb.europa.eu/press/calendars/mgcgc/html/index.en.html
# Nationalrat: https://www.parlament.gv.at/
termine:
  - datum: 2026-07-23
    name: EZB-Ratssitzung · Zinsentscheid
    tracker: EZB-Zinsentscheidungen und Folgen für Österreich
  - datum: 2026-09-10
    name: EZB-Ratssitzung · Zinsentscheid
    tracker: EZB-Zinsentscheidungen und Folgen für Österreich
  - datum: 2026-10-29
    name: EZB-Ratssitzung · Zinsentscheid
    tracker: EZB-Zinsentscheidungen und Folgen für Österreich
  - datum: 2026-12-17
    name: EZB-Ratssitzung · Zinsentscheid
    tracker: EZB-Zinsentscheidungen und Folgen für Österreich

# E-Mail-Versand (optional). SMTP-Zugang kommt aus .env — hier nur Empfänger.
# Leer lassen, solange nur Dateien in out/ erzeugt werden sollen.
recipients: []
mail_subject_prefix: "Auf Stand"

# Telegram-Versand (optional). Bot-Token kommt aus .env — hier nur Chat-IDs.
# Chat-ID herausfinden: Bot starten, https://api.telegram.org/bot<TOKEN>/getUpdates aufrufen.
telegram_chat_ids:
  - "8962080832"

# Feedback-Loop: Ein-Tap-Bewertung (👍/👎) unter jeder Ausgabe.
# Die Bewertungen landen in data/state.json -> Grundlage zum Schärfen des Prompts.
feedback_enabled: true

# E-Paper-Link am Ende jeder Ausgabe. Zeigt auf die offizielle E-Paper-Seite;
# eingeloggte Abonnent:innen werden zur aktuellen Ausgabe geleitet.
epaper_url: https://www.diepresse.com/epaper
