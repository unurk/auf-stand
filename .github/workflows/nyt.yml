name: NYT Briefing

on:
  schedule:
    # Wie lagebild.yml: mehrere Versuche im 15-Min-Takt, beginnend ~40 min VOR dem
    # Slot, damit die Ausgabe im Normalfall vor der Kuratierungszeit erzeugt und
    # deployt ist; die Webapp enthüllt sie dann punktgenau (06/11/16/20). Minuten
    # bewusst NICHT auf :00 (GitHubs Top-of-Hour-Stau meiden). Fenster decken
    # Sommer- wie Winterzeit ab; die genaue Ausgabe wählt `auto` aus der Wiener
    # Uhrzeit. Der Block-Guard in main.py liefert je Tag und Block nur einmal aus.
    - cron: "2,17,32,47 3-5 * * *"     # morgen     (Slot 04:00 Sommer / 05:00 Winter UTC)
    - cron: "2,17,32,47 8-10 * * *"    # mittag     (Slot 09:00 / 10:00 UTC)
    - cron: "2,17,32,47 13-15 * * *"   # nachmittag (Slot 14:00 / 15:00 UTC)
    - cron: "2,17,32,47 17-19 * * *"   # abend      (Slot 18:00 / 19:00 UTC)
  workflow_dispatch:       # Manueller Start (GitHub UI) und externer Trigger (cron-job.org)
    inputs:
      edition:
        description: "Welche Ausgabe? auto = nach Wiener Uhrzeit"
        type: choice
        default: auto
        options: [auto, morgen, mittag, nachmittag, abend]

jobs:
  nyt:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages-deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: NYT-State wiederherstellen
        uses: actions/cache@v4
        with:
          path: data/state.nyt.json
          key: nyt-state-${{ github.run_id }}
          restore-keys: nyt-state-

      - name: NYT-Briefing erzeugen
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          mkdir -p data out out/nyt
          # Expliziter edition-Input (UI/extern) hat Vorrang; sonst wählt `auto` die
          # fällige Ausgabe zeitzonensicher aus der WIENER Uhrzeit (mit Vorlauf),
          # nicht aus der UTC-Stunde. Vor dem Morgen-Fenster ist `auto` ein No-op.
          EDITION="${{ github.event.inputs.edition }}"
          case "$EDITION" in
            morgen|mittag|nachmittag|abend)
              python -m copilot.main "$EDITION" --config config.nyt.yaml ;;
            *)
              python -m copilot.main auto --config config.nyt.yaml ;;
          esac

      - name: NYT-State sichern
        uses: actions/cache/save@v4
        if: always()
        with:
          path: data/state.nyt.json
          key: nyt-state-${{ github.run_id }}

      - name: NYT-Site bauen und committen
        id: site
        if: always() && github.ref == 'refs/heads/master'
        env:
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
        run: |
          python -m copilot.main site --config config.nyt.yaml
          if [ -n "$(git status --porcelain site/nyt)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add site/nyt
            git commit -m "site/nyt: NYT-Ausgabe vom $(date -u +%F)"
            for i in 1 2 3 4; do
              git pull --rebase origin master
              git push origin HEAD:master && break
              sleep $((2 ** i))
            done
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Keine Änderung an site/nyt/ — kein Commit, kein Deploy."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: GitHub Pages hochladen
        uses: actions/upload-pages-artifact@v3
        if: always() && github.ref == 'refs/heads/master' && steps.site.outputs.changed == 'true'
        with:
          path: site

      - name: GitHub Pages deployen
        id: pages-deployment
        uses: actions/deploy-pages@v4
        if: always() && github.ref == 'refs/heads/master' && steps.site.outputs.changed == 'true'

      - name: Fehler melden
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            -d chat_id=8962080832 \
            -d text="❌ NYT Briefing: GitHub-Lauf fehlgeschlagen. Logs: https://github.com/unurk/auf-stand/actions"
