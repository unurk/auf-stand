name: NYT Briefing

on:
  schedule:
    # Selbe Fenster wie die Presse-Ausgabe (Wien-Takt), robuste Mehrfach-Crons.
    # Der Block-Guard in main.py stellt sicher, dass je Tag nur eine Ausgabe
    # pro Block erscheint, auch wenn mehrere Cron-Läufe feuern.
    - cron: "*/30 4-6 * * *"    # morgen     (~06:00 Wien)
    - cron: "*/30 9-11 * * *"   # mittag     (~11:00 Wien)
    - cron: "*/30 14-16 * * *"  # nachmittag (~16:00 Wien)
    - cron: "*/30 18-20 * * *"  # abend      (~20:00 Wien)
  workflow_dispatch:       # Manueller Start (GitHub UI) und externer Trigger (cron-job.org)
    inputs:
      edition:
        description: "Welche Ausgabe? auto = nach Wall-Clock-Uhrzeit"
        type: choice
        default: auto
        options: [auto, morgen, mittag, nachmittag, abend]

# Nie zwei Läufe parallel (siehe lagebild.yml): schützt den Block-Guard vor
# überlappenden Läufen mit demselben restaurierten State.
concurrency:
  group: nyt
  cancel-in-progress: false

jobs:
  nyt:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages-deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: NYT-State wiederherstellen
        uses: actions/cache@v4
        with:
          path: data/state.nyt.json
          key: nyt-state-${{ github.run_id }}
          restore-keys: nyt-state-

      - name: NYT-Briefing erzeugen
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          mkdir -p data out out/nyt
          EDITION="${{ github.event.inputs.edition }}"
          case "$EDITION" in
            morgen|mittag|nachmittag|abend)
              python -m copilot.main "$EDITION" --config config.nyt.yaml ;;
            *)
              HOUR=$(date -u +%H)
              if [ "$HOUR" -le "08" ]; then
                python -m copilot.main morgen --config config.nyt.yaml
              elif [ "$HOUR" -le "13" ]; then
                python -m copilot.main mittag --config config.nyt.yaml
              elif [ "$HOUR" -le "17" ]; then
                python -m copilot.main nachmittag --config config.nyt.yaml
              else
                python -m copilot.main abend --config config.nyt.yaml
              fi ;;
          esac

      - name: NYT-State sichern
        uses: actions/cache/save@v4
        if: always()
        with:
          path: data/state.nyt.json
          key: nyt-state-${{ github.run_id }}

      # Disaster-Recovery bei Cache-Eviction (siehe lagebild.yml).
      - name: NYT-State-Backup als Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nyt-state-backup
          path: data/state.nyt.json
          retention-days: 30
          if-no-files-found: ignore

      - name: NYT-Site bauen und committen
        id: site
        if: always() && github.ref == 'refs/heads/master'
        env:
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
        run: |
          python -m copilot.main site --config config.nyt.yaml
          if [ -n "$(git status --porcelain site/nyt)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add site/nyt
            git commit -m "site/nyt: NYT-Ausgabe vom $(date -u +%F)"
            for i in 1 2 3 4; do
              git pull --rebase origin master
              git push origin HEAD:master && break
              sleep $((2 ** i))
            done
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Keine Änderung an site/nyt/ — kein Commit, kein Deploy."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: GitHub Pages hochladen
        uses: actions/upload-pages-artifact@v3
        if: always() && github.ref == 'refs/heads/master' && steps.site.outputs.changed == 'true'
        with:
          path: site

      - name: GitHub Pages deployen
        id: pages-deployment
        uses: actions/deploy-pages@v4
        if: always() && github.ref == 'refs/heads/master' && steps.site.outputs.changed == 'true'
        continue-on-error: true

      - name: Fehler melden
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          # Repo-Variable pflegbar unter Settings → Variables; Fallback = bisherige ID.
          ALERT_CHAT_ID: ${{ vars.TELEGRAM_ALERT_CHAT_ID || '8962080832' }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            -d chat_id="$ALERT_CHAT_ID" \
            -d text="❌ NYT Briefing: GitHub-Lauf fehlgeschlagen. Logs: https://github.com/unurk/auf-stand/actions"
