name: Qualitätscheck

# Täglicher Check der veröffentlichten Morgen-Ausgabe — ersetzt ab 1.12.2026 die
# Prüfung durch den externen Bot. Deterministisch, ohne API-Aufruf, ohne neues
# Secret (GITHUB_TOKEN für das Issue, vorhandener Telegram-Bot für den Alarm).
# Details: copilot/pruefung.py, Ablauf bei Befund: UEBERGABE.md.
on:
  schedule:
    - cron: "40 5 * * *"   # 06:40 Wien (Winter) / 07:40 (Sommer) — nach der 06-Uhr-Ausgabe
  workflow_dispatch:
    inputs:
      datum:
        description: "Datum YYYY-MM-DD (leer = heute)"
        required: false
        default: ""
      ausgabe:
        description: "Ausgabe"
        type: choice
        default: morgen
        options: [morgen, mittag, nachmittag, abend]

concurrency:
  group: qualitaet
  cancel-in-progress: false

jobs:
  pruefen:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50   # Commit-Zeit der Ausgabe = Veröffentlichungszeit (Pünktlichkeit)

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - run: pip install -r requirements.txt

      - name: Ausgabe prüfen
        env:
          DATUM: ${{ github.event.inputs.datum }}
          AUSGABE: ${{ github.event.inputs.ausgabe || 'morgen' }}
        run: |
          case "$AUSGABE" in morgen|mittag|nachmittag|abend) ;; *) echo "Ungültige Ausgabe"; exit 1 ;; esac
          if [ -n "$DATUM" ]; then
            [[ "$DATUM" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "Datum bitte als YYYY-MM-DD"; exit 1; }
            python -m copilot.main pruefen --ausgabe "$AUSGABE" --bericht befund.md --datum "$DATUM"
          else
            python -m copilot.main pruefen --ausgabe "$AUSGABE" --bericht befund.md
          fi

      - name: Issue anlegen (ein Issue je Ausgabe)
        id: issue
        if: hashFiles('befund.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          AUSGABE: ${{ github.event.inputs.ausgabe || 'morgen' }}
          DATUM: ${{ github.event.inputs.datum }}
        run: |
          TAG="${DATUM:-$(TZ=Europe/Vienna date +%F)}"
          TITEL="Qualitätscheck: $AUSGABE $TAG"
          gh api "repos/$REPO/labels" -f name=qualitaetscheck -f color=d93f0b \
            -f description="Befund des täglichen Qualitätschecks" >/dev/null 2>&1 || true
          VORHANDEN=$(gh api "repos/$REPO/issues?state=open&labels=qualitaetscheck&per_page=100" \
            --jq ".[] | select(.title == \"$TITEL\") | .html_url" | head -1)
          if [ -n "$VORHANDEN" ]; then
            echo "Issue existiert bereits: $VORHANDEN"
            echo "url=$VORHANDEN" >> "$GITHUB_OUTPUT"
          else
            URL=$(gh api "repos/$REPO/issues" -f title="$TITEL" -F body=@befund.md \
              -f "labels[]=qualitaetscheck" --jq .html_url)
            echo "Issue angelegt: $URL"
            echo "url=$URL" >> "$GITHUB_OUTPUT"
          fi

      - name: Telegram-Alarm
        if: hashFiles('befund.md') != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ALERT_CHAT_ID: ${{ vars.TELEGRAM_ALERT_CHAT_ID || '8962080832' }}
          URL: ${{ steps.issue.outputs.url }}
        run: |
          N=$(grep -c '^- ' befund.md || true)
          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            --data-urlencode chat_id="$ALERT_CHAT_ID" \
            --data-urlencode text="🔎 Qualitätscheck: $N Befund(e) in der heutigen Ausgabe. ${URL:-Siehe GitHub Actions.}" \
            >/dev/null

      - name: Check selbst fehlgeschlagen melden
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ALERT_CHAT_ID: ${{ vars.TELEGRAM_ALERT_CHAT_ID || '8962080832' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            --data-urlencode chat_id="$ALERT_CHAT_ID" \
            --data-urlencode text="❌ Qualitätscheck konnte nicht laufen. Log: $RUN_URL" >/dev/null
