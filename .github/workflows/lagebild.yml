name: Lagebild

on:
  schedule:
    # Presse-Kuratierungstakt (Zeiten Wien; UTC+2 Sommer / UTC+1 Winter, leichte Drift).
    - cron: "10 4 * * *"   # 06:10 Wien → morgen
    - cron: "10 9 * * *"   # 11:10 Wien → mittag
    - cron: "10 14 * * *"  # 16:10 Wien → nachmittag
    - cron: "10 18 * * *"  # 20:10 Wien → abend
    - cron: "0 7 * * 6"    # Samstag 9:00 Wien: Wochen-Quittung
  workflow_dispatch:       # Manueller Start über GitHub UI

jobs:
  lagebild:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages-deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: State wiederherstellen
        uses: actions/cache@v4
        with:
          path: |
            data/state.json
            data/rueckkanal_offset.json
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: Ausgabe erzeugen
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
        run: |
          mkdir -p data out
          SCHEDULE="${{ github.event.schedule }}"
          if [ "$SCHEDULE" = "0 7 * * 6" ]; then
            python -m auf_stand.main woche
          elif [ "$SCHEDULE" = "10 4 * * *" ]; then
            python -m auf_stand.main morgen
          elif [ "$SCHEDULE" = "10 9 * * *" ]; then
            python -m auf_stand.main mittag
          elif [ "$SCHEDULE" = "10 14 * * *" ]; then
            python -m auf_stand.main nachmittag
          elif [ "$SCHEDULE" = "10 18 * * *" ]; then
            python -m auf_stand.main abend
          else
            # Externer Cron-Trigger (cron-job.org) oder manueller Start:
            # Ausgabe anhand von Uhrzeit + Wochentag bestimmen (vier Presse-Blöcke).
            HOUR=$(date -u +%H)
            DOW=$(date -u +%u)   # 1=Mo … 6=Sa, 7=So
            if [ "$DOW" = "6" ] && [ "$HOUR" = "07" ]; then
              python -m auf_stand.main woche
            elif [ "$HOUR" -le "08" ]; then
              python -m auf_stand.main morgen
            elif [ "$HOUR" -le "13" ]; then
              python -m auf_stand.main mittag
            elif [ "$HOUR" -le "18" ]; then
              python -m auf_stand.main nachmittag
            else
              python -m auf_stand.main abend
            fi
          fi

      - name: Rückkanal beantworten
        if: always()
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python -m auf_stand.main rueckkanal

      - name: Web-Ansicht bauen und committen
        if: always() && github.ref == 'refs/heads/master'
        env:
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
        run: |
          python -m auf_stand.main site
          if [ -n "$(git status --porcelain site)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add site
            git commit -m "site: Ausgabe vom $(date -u +%F)"
            for i in 1 2 3 4; do
              git push origin HEAD:master && break
              sleep $((2 ** i))
              git pull --rebase origin master
            done
          else
            echo "Keine Änderung an site/ — kein Commit."
          fi

      - name: GitHub Pages hochladen
        uses: actions/upload-pages-artifact@v3
        if: always() && github.ref == 'refs/heads/master'
        with:
          path: site

      - name: GitHub Pages deployen
        id: pages-deployment
        uses: actions/deploy-pages@v4
        if: always() && github.ref == 'refs/heads/master'

      - name: State sichern
        uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            data/state.json
            data/rueckkanal_offset.json
          key: state-${{ github.run_id }}

      - name: Fehler auf Telegram melden
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            -d chat_id=8962080832 \
            -d text="❌ Auf Stand: GitHub-Lauf fehlgeschlagen. Logs: https://github.com/unurk/auf-stand/actions"
