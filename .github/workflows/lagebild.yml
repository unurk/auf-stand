name: Lagebild

on:
  schedule:
    # GitHub-Actions-Crons feuern unzuverlässig (Verspätung bis zu Stunden,
    # gelegentliches komplettes Auslassen). Strategie: je Ausgabe MEHRERE Versuche
    # im 15-Minuten-Takt, beginnend ~40 min VOR dem Slot — so ist das Lagebild im
    # Normalfall schon VOR der Kuratierungszeit erzeugt und deployt; die Webapp
    # enthüllt es dann punktgenau zum Slot (06/11/16/20). Ist GitHub doch zu spät,
    # erscheint es sofort nach dem Deploy. Der Block-Guard in main.py liefert je
    # Tag und Block nur einmal aus (idempotent). Minuten bewusst NICHT auf :00
    # (GitHubs Top-of-Hour-Stau meiden). Fenster decken Sommer- wie Winterzeit ab
    # (Wien = UTC+2 Sommer / UTC+1 Winter); die genaue Ausgabe wählt `auto` aus der
    # Wiener Uhrzeit, nicht der UTC-Stunde.
    - cron: "2,17,32,47 3-5 * * *"     # morgen     (Slot 04:00 Sommer / 05:00 Winter UTC)
    - cron: "2,17,32,47 8-10 * * *"    # mittag     (Slot 09:00 / 10:00 UTC)
    - cron: "2,17,32,47 13-15 * * *"   # nachmittag (Slot 14:00 / 15:00 UTC)
    - cron: "2,17,32,47 17-19 * * *"   # abend      (Slot 18:00 / 19:00 UTC)
    - cron: "0 7 * * 6"                # Samstag 9:00 Wien: Wochen-Quittung
  workflow_dispatch:       # Manueller Start (GitHub UI) und externer Trigger (cron-job.org)
    inputs:
      edition:
        description: "Welche Ausgabe? auto = nach Wall-Clock-Uhrzeit"
        type: choice
        default: auto
        options: [auto, morgen, mittag, nachmittag, abend, woche]

# GitHub Pages erlaubt nur EIN aktives Deployment pro Environment. lagebild.yml,
# nyt.yml und pages.yml teilen sich daher dieselbe Concurrency-Gruppe: der zweite
# Lauf wartet, statt zu kollidieren (sonst „deployment_queued"-Timeout bzw. HTTP 400
# „in progress deployment"). cancel-in-progress: false bricht laufende Produktions-
# Läufe nie ab; ein verdrängter wartender Lauf wird vom nächsten Deploy (das die
# ganze site/ publiziert) ohnehin nachgeholt.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  lagebild:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages-deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: State wiederherstellen
        uses: actions/cache@v4
        with:
          path: |
            data/state.json
            data/rueckkanal_offset.json
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: Ausgabe erzeugen
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
        run: |
          mkdir -p data out
          # Auswahl-Reihenfolge:
          #  1) Expliziter edition-Input (manueller UI-Lauf / externer Trigger):
          #     benennt die Ausgabe direkt — unabhängig von der Uhrzeit. Gegen
          #     erlaubte Menge per case validiert (kein Injection).
          #  2) Interner Samstags-Cron → woche.
          #  3) Sonst (interne Wiederhol-Crons, UI-Lauf ohne Input): `auto` wählt die
          #     fällige Ausgabe aus der WIENER Uhrzeit (zeitzonensicher, mit Vorlauf),
          #     nicht aus der UTC-Stunde. Vor dem Morgen-Fenster ist `auto` ein No-op.
          # Der Block-Guard in main.py liefert je Tag und Block nur einmal aus (idempotent),
          # auch wenn mehrere Crons feuern.
          EDITION="${{ github.event.inputs.edition }}"
          case "$EDITION" in
            morgen|mittag|nachmittag|abend|woche)
              python -m copilot.main "$EDITION" ;;
            *)
              if [ "${{ github.event.schedule }}" = "0 7 * * 6" ]; then
                python -m copilot.main woche
              else
                python -m copilot.main auto
              fi ;;
          esac

      - name: Rückkanal beantworten
        if: always()
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python -m copilot.main rueckkanal

      - name: Web-Ansicht bauen und committen
        id: site
        if: always() && github.ref == 'refs/heads/master'
        env:
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
        run: |
          python -m copilot.main site
          if [ -n "$(git status --porcelain site)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add site
            git commit -m "site: Ausgabe vom $(date -u +%F)"
            for i in 1 2 3 4; do
              git push origin HEAD:master && break
              sleep $((2 ** i))
              git pull --rebase origin master
            done
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Keine Änderung an site/ — kein Commit, kein Deploy."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # Pages nur hochladen/deployen, wenn site/ sich tatsächlich geändert hat.
      # Sonst würden die vielen Wiederhol-Cron-Läufe (alle 30 Min) zig leere
      # Deploys/Tag auslösen; bei unveränderter Seite bedient Pages weiter den
      # letzten Stand.
      - name: GitHub Pages hochladen
        uses: actions/upload-pages-artifact@v3
        if: always() && github.ref == 'refs/heads/master' && steps.site.outputs.changed == 'true'
        with:
          path: site

      - name: GitHub Pages deployen
        id: pages-deployment
        uses: actions/deploy-pages@v4
        if: always() && github.ref == 'refs/heads/master' && steps.site.outputs.changed == 'true'

      - name: State sichern
        uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            data/state.json
            data/rueckkanal_offset.json
          key: state-${{ github.run_id }}

      - name: Fehler auf Telegram melden
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            -d chat_id=8962080832 \
            -d text="❌ Copilot: GitHub-Lauf fehlgeschlagen. Logs: https://github.com/unurk/auf-stand/actions"
