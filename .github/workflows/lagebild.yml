name: Lagebild

on:
  schedule:
    # GitHub-Actions-Crons feuern unzuverlässig (Verspätung bis zu Stunden,
    # gelegentliches komplettes Auslassen). Darum je Ausgabe-Fenster MEHRERE
    # Versuche im 30-Minuten-Takt — es genügt, wenn EINER feuert. Der Block-Guard
    # in main.py liefert je Tag und Block trotzdem nur einmal aus (idempotent,
    # kein Duplikat bei Mehrfachlauf). Die Fenster starten zur Kuratierungszeit
    # und decken Sommer- wie Winterzeit ab (Wien = UTC+2 Sommer / UTC+1 Winter).
    - cron: "*/30 4-6 * * *"    # morgen     (~06:00 Wien)
    - cron: "*/30 9-11 * * *"   # mittag     (~11:00 Wien)
    - cron: "*/30 14-16 * * *"  # nachmittag (~16:00 Wien)
    - cron: "*/30 18-20 * * *"  # abend      (~20:00 Wien)
    - cron: "0 7 * * 6"         # Samstag 9:00 Wien: Wochen-Quittung
  workflow_dispatch:       # Manueller Start (GitHub UI) und externer Trigger (cron-job.org)
    inputs:
      edition:
        description: "Welche Ausgabe? auto = nach Wall-Clock-Uhrzeit"
        type: choice
        default: auto
        options: [auto, morgen, mittag, nachmittag, abend, woche]

jobs:
  lagebild:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages-deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: State wiederherstellen
        uses: actions/cache@v4
        with:
          path: |
            data/state.json
            data/rueckkanal_offset.json
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: Ausgabe erzeugen
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
        run: |
          mkdir -p data out
          # Auswahl-Reihenfolge:
          #  1) Expliziter edition-Input (externer Trigger cron-job.org / manueller UI-Lauf):
          #     benennt die Ausgabe direkt — unabhängig von der Uhrzeit, robust gegen
          #     Trigger-Verspätung. Gegen erlaubte Menge per case validiert (kein Injection).
          #  2) Interner Samstags-Cron → woche.
          #  3) Sonst (interne Wiederhol-Crons, UI-Lauf ohne Input): Wall-Clock-Fallback,
          #     damit selbst ein verspäteter Cron den AKTUELL richtigen Block trifft.
          # Der Block-Guard in main.py liefert je Tag und Block nur einmal aus (idempotent),
          # auch wenn externer Trigger und interner Cron beide feuern.
          # Ausgabe AUFLÖSEN (in RESOLVED), nach $GITHUB_ENV exportieren und nur den
          # Text erzeugen. Das langsame Audio (TTS) läuft erst NACH dem Text-Deploy
          # (eigener Schritt unten, nutzt $RESOLVED_EDITION), damit die Webapp nicht
          # hinter dem Telegram-Text zurückbleibt.
          EDITION="${{ github.event.inputs.edition }}"
          case "$EDITION" in
            morgen|mittag|nachmittag|abend|woche)
              RESOLVED="$EDITION" ;;
            *)
              if [ "${{ github.event.schedule }}" = "0 7 * * 6" ]; then
                RESOLVED="woche"
              else
                HOUR=$(date -u +%H)
                if [ "$HOUR" -le "08" ]; then
                  RESOLVED="morgen"
                elif [ "$HOUR" -le "13" ]; then
                  RESOLVED="mittag"
                elif [ "$HOUR" -le "17" ]; then
                  RESOLVED="nachmittag"
                else
                  RESOLVED="abend"
                fi
              fi ;;
          esac
          echo "RESOLVED_EDITION=$RESOLVED" >> "$GITHUB_ENV"
          python -m copilot.main "$RESOLVED"

      - name: Rückkanal beantworten
        if: always()
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python -m copilot.main rueckkanal

      # ── 1. Zyklus: TEXT sofort bauen + deployen ──────────────────────────────
      # Bewusst VOR der Audio-Erzeugung: die Webapp geht mit dem Lagebild-Text live,
      # Sekunden nach dem Telegram-Text — statt erst nach der langsamen TTS zu warten.
      - name: Web-Ansicht bauen und committen (Text)
        id: site-text
        if: always() && github.ref == 'refs/heads/master'
        env:
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
        run: |
          python -m copilot.main site
          if [ -n "$(git status --porcelain site)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add site
            git commit -m "site: Ausgabe vom $(date -u +%F)"
            for i in 1 2 3 4; do
              git push origin HEAD:master && break
              sleep $((2 ** i))
              git pull --rebase origin master
            done
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Keine Änderung an site/ — kein Commit, kein Deploy."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # Pages nur hochladen/deployen, wenn site/ sich tatsächlich geändert hat.
      # Sonst würden die vielen Wiederhol-Cron-Läufe (alle 30 Min) zig leere
      # Deploys/Tag auslösen; bei unveränderter Seite bedient Pages weiter den
      # letzten Stand.
      - name: GitHub Pages hochladen (Text)
        uses: actions/upload-pages-artifact@v3
        if: always() && github.ref == 'refs/heads/master' && steps.site-text.outputs.changed == 'true'
        with:
          path: site

      - name: GitHub Pages deployen (Text)
        id: pages-text
        uses: actions/deploy-pages@v4
        if: always() && github.ref == 'refs/heads/master' && steps.site-text.outputs.changed == 'true'

      # ── Audio (TTS) NACH dem Text-Deploy ─────────────────────────────────────
      # Langsam (OpenAI-Call + Upload). Liest das bereits geschriebene out/<datum>-
      # <edition>.md, vertont es und schickt die mp3 an Telegram. No-Op bei woche /
      # ohne OPENAI_API_KEY.
      - name: Audio erzeugen und senden
        if: always()
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python -m copilot.main audio --edition "$RESOLVED_EDITION"

      # ── 2. Zyklus: Audio-Player nachreichen ──────────────────────────────────
      # build_site kopiert die neue mp3 ins Archiv und fügt den Audio-Player ein →
      # Diff → zweiter Deploy. Ohne Audio (kein Diff) wird dieser Zyklus übersprungen.
      - name: Web-Ansicht bauen und committen (Audio)
        id: site
        if: always() && github.ref == 'refs/heads/master'
        env:
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
        run: |
          python -m copilot.main site
          if [ -n "$(git status --porcelain site)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add site
            git commit -m "site: Audio vom $(date -u +%F)"
            for i in 1 2 3 4; do
              git push origin HEAD:master && break
              sleep $((2 ** i))
              git pull --rebase origin master
            done
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Keine Änderung an site/ — kein zweiter Deploy."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: GitHub Pages hochladen
        uses: actions/upload-pages-artifact@v3
        if: always() && github.ref == 'refs/heads/master' && steps.site.outputs.changed == 'true'
        with:
          path: site

      - name: GitHub Pages deployen
        id: pages-deployment
        uses: actions/deploy-pages@v4
        if: always() && github.ref == 'refs/heads/master' && steps.site.outputs.changed == 'true'

      - name: State sichern
        uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            data/state.json
            data/rueckkanal_offset.json
          key: state-${{ github.run_id }}

      - name: Fehler auf Telegram melden
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            -d chat_id=8962080832 \
            -d text="❌ Copilot: GitHub-Lauf fehlgeschlagen. Logs: https://github.com/unurk/auf-stand/actions"
