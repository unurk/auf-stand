name: Lagebild

on:
  schedule:
    # GitHub-Actions-Crons feuern unzuverlässig (Verspätung bis zu Stunden,
    # gelegentliches komplettes Auslassen). Darum je Ausgabe-Fenster MEHRERE
    # Versuche im 30-Minuten-Takt — es genügt, wenn EINER feuert. Der Block-Guard
    # in main.py liefert je Tag und Block trotzdem nur einmal aus (idempotent,
    # kein Duplikat bei Mehrfachlauf). Die Fenster starten zur Kuratierungszeit
    # und decken Sommer- wie Winterzeit ab (Wien = UTC+2 Sommer / UTC+1 Winter).
    - cron: "*/30 4-6 * * *"    # morgen     (~06:00 Wien)
    - cron: "*/30 9-11 * * *"   # mittag     (~11:00 Wien)
    - cron: "*/30 14-16 * * *"  # nachmittag (~16:00 Wien)
    - cron: "*/30 18-20 * * *"  # abend      (~20:00 Wien)
    - cron: "0 7 * * 6"         # Samstag 9:00 Wien: Wochen-Quittung
  workflow_dispatch:       # Manueller Start über GitHub UI

jobs:
  lagebild:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages-deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: State wiederherstellen
        uses: actions/cache@v4
        with:
          path: |
            data/state.json
            data/rueckkanal_offset.json
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: Ausgabe erzeugen
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
        run: |
          mkdir -p data out
          # woche kommt ausschließlich vom expliziten Samstags-Cron.
          # Alle anderen Läufe (Wiederhol-Crons je Fenster, manueller Start,
          # externer Trigger) wählen die Ausgabe nach Wall-Clock-Uhrzeit. So
          # erwischt selbst ein stark verspäteter Cron den AKTUELL richtigen
          # Block; der Block-Guard in main.py liefert je Block nur einmal aus.
          if [ "${{ github.event.schedule }}" = "0 7 * * 6" ]; then
            python -m copilot.main woche
          else
            HOUR=$(date -u +%H)
            if [ "$HOUR" -le "08" ]; then
              python -m copilot.main morgen
            elif [ "$HOUR" -le "13" ]; then
              python -m copilot.main mittag
            elif [ "$HOUR" -le "17" ]; then
              python -m copilot.main nachmittag
            else
              python -m copilot.main abend
            fi
          fi

      - name: Rückkanal beantworten
        if: always()
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python -m copilot.main rueckkanal

      - name: Web-Ansicht bauen und committen
        id: site
        if: always() && github.ref == 'refs/heads/master'
        env:
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
        run: |
          python -m copilot.main site
          if [ -n "$(git status --porcelain site)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add site
            git commit -m "site: Ausgabe vom $(date -u +%F)"
            for i in 1 2 3 4; do
              git push origin HEAD:master && break
              sleep $((2 ** i))
              git pull --rebase origin master
            done
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Keine Änderung an site/ — kein Commit, kein Deploy."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # Pages nur hochladen/deployen, wenn site/ sich tatsächlich geändert hat.
      # Sonst würden die vielen Wiederhol-Cron-Läufe (alle 30 Min) zig leere
      # Deploys/Tag auslösen; bei unveränderter Seite bedient Pages weiter den
      # letzten Stand.
      - name: GitHub Pages hochladen
        uses: actions/upload-pages-artifact@v3
        if: always() && github.ref == 'refs/heads/master' && steps.site.outputs.changed == 'true'
        with:
          path: site

      - name: GitHub Pages deployen
        id: pages-deployment
        uses: actions/deploy-pages@v4
        if: always() && github.ref == 'refs/heads/master' && steps.site.outputs.changed == 'true'

      - name: State sichern
        uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            data/state.json
            data/rueckkanal_offset.json
          key: state-${{ github.run_id }}

      - name: Fehler auf Telegram melden
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            -d chat_id=8962080832 \
            -d text="❌ Copilot: GitHub-Lauf fehlgeschlagen. Logs: https://github.com/unurk/auf-stand/actions"
