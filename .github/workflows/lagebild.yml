name: Lagebild

on:
  schedule:
    # GitHub-Actions-Crons feuern unzuverlässig (Verspätung bis zu Stunden,
    # gelegentliches komplettes Auslassen). Darum je Ausgabe-Fenster MEHRERE
    # Versuche im 30-Minuten-Takt — es genügt, wenn EINER feuert. Der Block-Guard
    # in main.py liefert je Tag und Block trotzdem nur einmal aus (idempotent,
    # kein Duplikat bei Mehrfachlauf). Die Fenster starten zur Kuratierungszeit
    # und decken Sommer- wie Winterzeit ab (Wien = UTC+2 Sommer / UTC+1 Winter).
    - cron: "*/30 4-6 * * *"    # morgen     (~06:00 Wien)
    - cron: "*/30 9-11 * * *"   # mittag     (~11:00 Wien)
    - cron: "*/30 14-16 * * *"  # nachmittag (~16:00 Wien)
    - cron: "*/30 18-20 * * *"  # abend      (~20:00 Wien)
    - cron: "0 7 * * 6"         # Samstag 9:00 Wien: Wochen-Quittung
  workflow_dispatch:       # Manueller Start (GitHub UI) und externer Trigger (cron-job.org)
    inputs:
      edition:
        description: "Welche Ausgabe? auto = nach Wall-Clock-Uhrzeit"
        type: choice
        default: auto
        options: [auto, morgen, mittag, nachmittag, abend, woche]

# Nie zwei Läufe parallel: die 30-Minuten-Wiederhol-Crons und der externe Trigger
# können sich sonst überlappen — beide restoren dann denselben alten State, der
# Block-Guard in main.py greift nicht und es kommt zur Doppelzustellung.
concurrency:
  group: lagebild
  cancel-in-progress: false

jobs:
  lagebild:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages-deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: State wiederherstellen
        uses: actions/cache@v4
        with:
          path: |
            data/state.json
            data/rueckkanal_offset.json
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: Ausgabe erzeugen
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          EDITION: ${{ github.event.inputs.edition }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          mkdir -p data out
          # Welche Ausgabe? (Details: copilot/slot.py)
          #  1) Expliziter edition-Input (cron-job.org / manueller UI-Lauf): genau diese
          #     Ausgabe, ohne Verspätungsprüfung. Gegen erlaubte Menge per case validiert.
          #  2) Geplanter Lauf: Ausgabe aus dem Cron-Slot, der gefeuert hat
          #     (github.event.schedule) — NIE aus der Uhrzeit. Startet der Lauf mehr als
          #     3 h nach seinem Slot, wird er übersprungen: Ein verspäteter 20-Uhr-Cron um
          #     01:08 darf weder als Morgen-Ausgabe erscheinen noch die 06-Uhr-Ausgabe sperren.
          #  3) Manueller UI-Lauf ohne Input: Wiener Uhrzeit (auto).
          # Der Block-Guard in main.py liefert je Tag und Block nur einmal aus (idempotent).
          case "$EDITION" in
            morgen|mittag|nachmittag|abend|woche)
              python -m copilot.main "$EDITION" ;;
            *)
              if [ -n "$SCHEDULE" ]; then
                python -m copilot.main slot --schedule "$SCHEDULE"
              else
                python -m copilot.main auto
              fi ;;
          esac

      - name: Rückkanal beantworten
        if: always()
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python -m copilot.main rueckkanal

      # Engagement-Auswertung: samstags mit der Wochen-Quittung. Läuft NACH dem
      # Rückkanal (der die Telegram-Taps einsammelt) und braucht kein Secret —
      # Web-Zähler ist frei lesbar, Telegram-Daten liegen im State.
      - name: Engagement-Auswertung (wöchentlich)
        if: >-
          always() && github.ref == 'refs/heads/master' &&
          (github.event.inputs.edition == 'woche' || github.event.schedule == '0 7 * * 6')
        run: |
          python -m copilot.main engagement
          if [ -n "$(git status --porcelain berichte)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add berichte
            git commit -m "berichte: Engagement-Auswertung $(date -u +%F)"
            for i in 1 2 3 4; do
              git push origin HEAD:master && break
              sleep $((2 ** i))
              git pull --rebase origin master
            done
          fi

      - name: Web-Ansicht bauen und committen
        id: site
        if: always() && github.ref == 'refs/heads/master'
        env:
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
        run: |
          python -m copilot.main site
          if [ -n "$(git status --porcelain site)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add site
            git commit -m "site: Ausgabe vom $(date -u +%F)"
            for i in 1 2 3 4; do
              git push origin HEAD:master && break
              sleep $((2 ** i))
              git pull --rebase origin master
            done
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Keine Änderung an site/ — kein Commit (Deploy entscheidet der Pages-Check)."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # Pages deployen, wenn site/ sich geändert hat ODER die Live-Seite hinterherhinkt
      # (Vergleich deploy.json ↔ HEAD, copilot/pages.py). So holt ein späterer Lauf
      # einen gescheiterten Deploy nach — und bei aktuellem Stand gibt es keinen
      # leeren Deploy alle 30 Minuten.
      - name: Pages-Stand prüfen
        id: pages
        if: always() && github.ref == 'refs/heads/master' && steps.site.outcome == 'success'
        env:
          SITE_GEAENDERT: ${{ steps.site.outputs.changed }}
        run: |
          # Erst auf den neuesten master vorspulen: Sonst könnte ein Lauf mit älterem
          # Checkout (z. B. NYT neben der Presse-Ausgabe) einen ÄLTEREN Stand deployen.
          git pull --ff-only --quiet origin master || echo "Kein Fast-Forward möglich — prüfe lokalen Stand."
          python -m copilot.main pages-check --site-geaendert "${SITE_GEAENDERT:-false}"

      - name: GitHub Pages hochladen
        uses: actions/upload-pages-artifact@v3
        if: always() && steps.pages.outputs.deploy == 'true'
        with:
          path: site

      - name: GitHub Pages deployen
        id: pages-deployment
        uses: actions/deploy-pages@v4
        if: always() && steps.pages.outputs.deploy == 'true'
        continue-on-error: true

      # 24.11. (Lauf 45330313914): deploy-pages fand das 370 ms zuvor hochgeladene
      # Artifact nicht („Found 0 artifact(s)") — die Artifact-Liste hinkte nach.
      # Ein zweiter Versuch nach kurzer Pause trifft eine nachgezogene Liste.
      - name: Pages-Deploy kurz abwarten
        if: always() && steps.pages-deployment.outcome == 'failure'
        run: sleep 45

      - name: GitHub Pages deployen (2. Versuch)
        id: pages-deployment-2
        uses: actions/deploy-pages@v4
        if: always() && steps.pages-deployment.outcome == 'failure'
        continue-on-error: true

      - name: Pages-Deploy-Fehler melden
        if: always() && steps.pages-deployment.outcome == 'failure' && steps.pages-deployment-2.outcome != 'success'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ALERT_CHAT_ID: ${{ vars.TELEGRAM_ALERT_CHAT_ID || '8962080832' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            --data-urlencode chat_id="$ALERT_CHAT_ID" \
            --data-urlencode text="⚠️ Copilot: Website-Deploy (GitHub Pages) 2× gescheitert — die Seite zeigt noch den alten Stand. Der nächste Lauf deployt automatisch nach. Log: $RUN_URL"

      - name: State sichern
        uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            data/state.json
            data/rueckkanal_offset.json
          key: state-${{ github.run_id }}

      # Disaster-Recovery: Der Cache kann evictet werden (Größenlimit) — dann wären
      # seen-IDs, Feedback, Dossier und v. a. die Push-Subscriptions weg. Das
      # Artifact ist privat (anders als das öffentliche Repo, in das state.json
      # wegen der Push-Endpoints nicht gehört) und manuell wiederherstellbar.
      - name: State-Backup als Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: state-backup
          path: |
            data/state.json
            data/rueckkanal_offset.json
          retention-days: 30
          if-no-files-found: ignore

      - name: Fehler auf Telegram melden
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          # Repo-Variable pflegbar unter Settings → Variables; Fallback = bisherige ID.
          ALERT_CHAT_ID: ${{ vars.TELEGRAM_ALERT_CHAT_ID || '8962080832' }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            -d chat_id="$ALERT_CHAT_ID" \
            -d text="❌ Copilot: GitHub-Lauf fehlgeschlagen. Logs: https://github.com/unurk/auf-stand/actions"
