name: Rückkanal

on:
  schedule:
    # Alle 15 Minuten zwischen 6:00–20:00 UTC (= 8:00–22:00 Wien CEST)
    - cron: "*/15 6-20 * * *"
  workflow_dispatch:

jobs:
  rueckkanal:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Offset wiederherstellen
        uses: actions/cache@v4
        with:
          path: data/rueckkanal_offset.json
          key: rueckkanal-offset-${{ github.run_id }}
          restore-keys: rueckkanal-offset-

      - name: Fragen beantworten
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          mkdir -p data
          python -m auf_stand.main rueckkanal

      - name: Offset sichern
        uses: actions/cache/save@v4
        if: always()
        with:
          path: data/rueckkanal_offset.json
          key: rueckkanal-offset-${{ github.run_id }}
