    .tab { flex: 1; display: flex; flex-direction: column; align-items: center;

    .tab:hover { color: var(--text); text-decoration: none; }
    .tab svg { width: 23px; height: 23px; }
    .tab.active { color: var(--text); border-top-color: var(--accent); }
